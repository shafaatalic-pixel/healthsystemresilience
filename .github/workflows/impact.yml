name: Impact figures (nightly)

# Fetches the Impact page's figures from GA4, Cloudflare and Search Console,
# renders them into the markup, commits only if a number actually changed, and
# purges the edge cache so the change is visible immediately rather than in an
# hour's time.
#
# 07:12 UTC is 03:12 ET while the US is on daylight time. Cron is UTC only, so
# from early November this runs at 02:12 ET until the clocks change back. The
# page prints the time of the run itself, not the schedule, so it stays honest.
#
# A failed fetch is not a failed job. data/impact_status.json is written and
# committed either way, and the page reads it to say how old its figures are.

on:
  schedule:
    - cron: "12 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: impact-figures
  cancel-in-progress: false

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the two libraries the fetcher needs
        run: pip install --quiet google-auth requests

      - name: Fetch the figures
        id: fetch
        continue-on-error: true
        env:
          GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          GSC_SITE: ${{ vars.GSC_SITE || 'sc-domain:hsraep.org' }}
        run: python3 scripts/impact_fetch.py

      - name: Render the figures into the pages
        run: python3 scripts/impact_render.py .

      - name: Commit, but only if something changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "hsrep-bot"
          git config user.email "noreply@hsraep.org"

          FILES="data/impact.json data/impact_status.json data/impact_history.json impact.html index.html"

          commit_figures() {
            git commit -q \
              -m "Impact: nightly figures $(date -u +%Y-%m-%d)" \
              -m "Automated by .github/workflows/impact.yml. Sources: GA4 Data API, Cloudflare GraphQL, Search Console API. See data/impact_status.json for which sources answered."
          }

          stage_figures() {
            staged=0
            for f in $FILES; do
              if [ -f "$f" ]; then git add "$f"; staged=$((staged+1)); fi
            done
            echo "staged $staged file(s)"
          }

          # One at a time, and only if it exists. `git add a b c` refuses the
          # whole command when any single pathspec matches nothing, so listing
          # data/impact_history.json - which is not created until there are
          # weeks of runs to draw - staged NOTHING, every run, silently. The
          # 2>/dev/null that was here hid it.
          stage_figures
          if [ "$staged" -eq 0 ]; then
            echo "::error::Nothing was staged. The fetcher or renderer did not write." >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change. Nothing committed."
            exit 0
          fi

          commit_figures

          # These five files are generated, never hand-authored, so there is
          # nothing here to reconcile: whatever this run fetched is the newer
          # truth by definition. If main moves while the job is running - the
          # roundtable workflow, or a push from a laptop - the push is rejected,
          # and both `git pull --rebase` and `git pull --no-rebase` then try to
          # merge two machine-written JSON files line by line and fail on a
          # conflict no one is awake to resolve. `-X ours` does not save it
          # either: under a rebase the sides are inverted, so "ours" is the
          # remote and the fresh figures are the side that gets discarded.
          #
          # So: do not merge. Take the new tip, set the generated files back on
          # top of it, and commit that. Every other change on the tip survives
          # untouched; the figures are simply the newest ones.
          pushed=false
          for attempt in 1 2 3; do
            if git push; then pushed=true; break; fi

            echo "Push rejected on attempt ${attempt}. main moved; rebuilding on the new tip."
            keep="$(mktemp -d)"
            for f in $FILES; do
              if [ -f "$f" ]; then
                mkdir -p "${keep}/$(dirname "$f")"
                cp "$f" "${keep}/${f}"
              fi
            done

            git fetch origin main
            git reset --hard origin/main

            for f in $FILES; do
              if [ -f "${keep}/${f}" ]; then cp "${keep}/${f}" "$f"; fi
            done
            rm -rf "$keep"

            stage_figures
            if git diff --cached --quiet; then
              echo "The new tip already carries these figures. Nothing left to push."
              pushed=true
              break
            fi
            commit_figures
          done

          if [ "$pushed" != true ]; then
            echo "::error::Push still rejected after 3 attempts." >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for Pages to build
        if: steps.commit.outputs.changed == 'true'
        run: sleep 90

      - name: Purge the edge cache
        if: steps.commit.outputs.changed == 'true'
        env:
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://hsraep.org/impact.html","https://hsraep.org/","https://hsraep.org/index.html","https://hsraep.org/data/impact.json"]}' \
            | tee /tmp/purge.json
          python3 -c "import json;d=json.load(open('/tmp/purge.json'));raise SystemExit(0 if d.get('success') else 'purge failed: %s'%d.get('errors'))"

      - name: Report what the fetch did
        run: |
          echo "### Impact figures" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              s = json.load(open("data/impact_status.json"))
          except Exception:
              print("No status file was written. The fetcher did not get that far.")
              raise SystemExit(0)
          print("- attempted: %s" % s.get("attempted"))
          print("- last success: %s" % s.get("last_success"))
          for k, v in (s.get("sources") or {}).items():
              print("- **%s** - %s" % (k, v))
          PY

      - name: Fail the run if a source did not answer
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "The fetch step reported a failure. The status file is committed,"
          echo "so the page will say how old its figures are."
          exit 1
