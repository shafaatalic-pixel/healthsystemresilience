/* Layout: a working tool. Header band, toolbar, view tabs, then list + side panel (stacks on phones). */
:root{

}

  --coral:#FF8163; --coral-text:#FF9F88;
  --good:#6FD1B5; --good-bg:#123B33; --warn:#F2C46B; --warn-bg:#3A2E10; --crit:#FF9A90; --crit-bg:#401C1A;
  --focus:#8DB4FF; --chart:#EAF1F8; --chart-soft:#4F6E91; --band:#0A1626; --band-2:#13243A; --on-band:#FFFFFF; --on-band-muted:#AFC0D3; color-scheme:dark; --field-border:#6F8DB0; --sel-bg:#1E3A5C; --coral-line:#F26D5A;
}}
:root[data-theme="dark"]{
  --paper:#0F2036; --surface:#132842; --panel:#17304d; --hair:#2A4B6E;
  --navy:#EAF1F8; --on-navy:#0F2036; --ink:#DBE4EE; --muted:#A3B3C4;
  --coral:#FF8163; --coral-text:#FF9F88;
  --good:#6FD1B5; --good-bg:#123B33; --warn:#F2C46B; --warn-bg:#3A2E10; --crit:#FF9A90; --crit-bg:#401C1A;
  --focus:#8DB4FF; --chart:#EAF1F8; --chart-soft:#4F6E91; --band:#0A1626; --band-2:#13243A; --on-band:#FFFFFF; --on-band-muted:#AFC0D3; color-scheme:dark; --field-border:#6F8DB0; --sel-bg:#1E3A5C; --coral-line:#F26D5A;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);color:var(--navy);text-wrap:balance;margin:0;font-weight:600}
h2{font-size:19px} h3{font-size:16px}
p{margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:18px}

header.top{background:var(--band);color:var(--on-band)}

.banner{border-radius:8px;padding:10px 12px;font-size:13px}

.banner.crit{background:var(--crit-bg);color:var(--crit)}

.banner.good{background:var(--good-bg);color:var(--good)}
nav.views{display:flex;flex-wrap:wrap;gap:6px}

.bar{height:10px;border-radius:5px;background:var(--panel);overflow:hidden}

.tile .xs{line-height:1.35}

html[lang="bn"] h1,html[lang="bn"] h2,html[lang="bn"] h3,html[lang="bn"] .usp-h,html[lang="bn"] .nextbox .nb-h b,html[lang="bn"] .flow b,html[lang="bn"] .pcard .pc-t,html[lang="bn"] .brand .apptitle .tt{font-family:'Noto Sans Bengali', var(--display);font-weight:600}

#pubBar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--ink);padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));font-size:14px;border-bottom:1px solid var(--hair)}

.seg button{border:0;background:var(--surface);padding:8px 14px;min-height:44px;cursor:pointer;color:var(--navy);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:10px}
.pcard{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);cursor:pointer;color:var(--ink);min-height:120px}
.pcard:hover{border-color:var(--navy)}
.pcard[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 3px 0 0 var(--navy);background:var(--panel)}
.pcard .pc-t{font-family:var(--display);font-weight:600;font-size:16px;color:var(--navy);line-height:1.25}
.pcard .pc-f{font-size:13px;color:var(--ink)}
.pcard .pc-m{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ocards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:10px}
.ocard{border:1px solid var(--hair);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.ocard.on{border-color:var(--navy);box-shadow:inset 3px 0 0 var(--navy)}
.ready{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px 16px}
.ready .field > span{display:flex;gap:6px;align-items:center}
.tick{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:700;flex:0 0 auto;border:1.5px solid var(--hair);color:transparent}
.tick.on{background:var(--good-bg);border-color:transparent;color:var(--good)}
.step{border:1px solid var(--hair);border-radius:10px;background:var(--surface);overflow:hidden}
.step > summary, .step > .sh{display:flex;gap:12px;align-items:center;padding:12px 16px;list-style:none;cursor:pointer}
.step > .sh{cursor:default;border-bottom:1px solid var(--hair)}
.step > summary::-webkit-details-marker{display:none}
.step[open] > summary{border-bottom:1px solid var(--hair)}
.step .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--navy);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--navy);flex:0 0 auto}
.step.done .k{background:var(--good-bg);border-color:transparent;color:var(--good)}
.step .st{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto}
.step .st b{color:var(--navy);font-weight:600}
.step .st span{font-size:12px;color:var(--muted)}
.step > summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:16px}
.step[open] > summary::after{content:"\2212"}
.step > .sb{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.pside{display:flex;flex-direction:column;gap:12px}
footer.foot{background:var(--band);color:var(--on-band-muted);margin-top:24px}
footer.foot .wrap{padding-block:16px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;font-size:12px}
footer.foot b{color:var(--on-band);font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* uiux-1107: start card, grouped tours, setup drawer, docked tour box */
.pubstart{gap:14px}
.pubstart h1{margin:0}
.ps-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.ps-grid{grid-template-columns:minmax(0,1fr)}}
.ps-case,.ps-tour{border:1px solid var(--hair);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.ps-case{border-left:4px solid var(--coral)}
.ps-case .row:last-child,.ps-tour .row:last-child{margin-top:auto}
.ps-id{font-family:var(--mono);font-weight:600;font-size:17px;color:var(--navy)}
.ps-tour b{font-size:16px;color:var(--navy)}
.ps-sub{font-size:15px;margin:6px 0 0;color:var(--navy)}
.tourcard .tc-role{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral-text)}
html[lang="bn"] .tourcard .tc-role,.tourcard[lang="bn"] .tc-role{letter-spacing:.02em;text-transform:none;font-family:'Noto Sans Bengali',var(--mono)}
.tourcard .tc-meta{font-size:12.5px;color:var(--muted);margin-top:auto}
.tourcard.feat{border-left:4px solid var(--coral)}
details.setupwrap{border:1px solid var(--hair);border-radius:12px;background:var(--surface)}
details.setupwrap>summary{cursor:pointer;list-style:none;padding:14px 44px 14px 16px;display:flex;flex-direction:column;gap:2px;position:relative}
details.setupwrap>summary::-webkit-details-marker{display:none}
details.setupwrap>summary::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
details.setupwrap[open]>summary::after{transform:translateY(-30%) rotate(225deg)}
details.setupwrap>summary b{font-size:17px;color:var(--navy)}
details.setupwrap>summary:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:12px}
details.setupwrap[open]>summary{border-bottom:1px solid var(--hair)}
details.setupwrap .sw-body{display:flex;flex-direction:column;gap:16px;padding:16px}
.case-hl{outline:3px solid var(--coral)!important;outline-offset:4px;border-radius:10px}
#tourBox .tb-h{position:sticky;top:-12px;background:var(--surface);padding:2px 0 4px;z-index:1}
#tourBox .tb-x{white-space:nowrap}
@media (min-width:1100px){
  html.touring body > .wrap{padding-right:calc(400px + max(16px, env(safe-area-inset-right, 0px)))}
  html.touring #tourBox{top:50%;bottom:auto;transform:translateY(-50%);width:368px;max-height:calc(100vh - 32px);overflow:auto}
}
@media (max-width:1099.98px){
  #tourBox{left:0;right:0;bottom:0;width:auto;border-radius:14px 14px 0 0;border-width:2px 0 0;max-height:46vh;overflow:auto;padding-bottom:max(12px, env(safe-area-inset-bottom, 0px))}
  html.touring body{padding-bottom:var(--tour-h, 46vh)}
  .tour-hl,.case-hl{scroll-margin-top:16px}
}
@media (max-width:600px){
  header.top .wrap{padding-block:10px;gap:8px}
  .brand .lockup{height:40px;width:auto}
  .brand .apptitle .eb{display:none}
  #pubBar{padding:8px 12px;font-size:13px;gap:6px}
  #pubBar .pb-more{display:none}
  #pubBar .pb-a{gap:6px;flex-wrap:nowrap}
  #pubBar .pb-a .btn{padding:6px 9px;font-size:13px;white-space:nowrap}
  .journey{gap:8px}
  .journey a{padding:8px 10px;align-items:center}
  .journey a .k{width:28px;height:28px}
  .journey a .k svg{width:15px;height:15px}
  .journey a .s{display:none}
  .pubstart h1{font-size:26px}
}
</style>

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fnv(text){ let h = 2166136261; for (const ch of String(text)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16).padStart(8, '0'); }
async function hashText(text){
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(text))); return Array.from(new Uint8Array(b)).slice(0, 6).map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch(e){ return 'f' + fnv(text); }
}
function median(a){ if (!a.length) return null; const s = a.slice().sort((x,y)=>x-y); const m = Math.floor(s.length/2); return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; }
function pct(n, d){ return d ? Math.round(1000 * n / d) / 10 : null; }
function wilson(n, d){ if (!d) return null; const z = 1.96, p = n / d; const den = 1 + z*z/d; const c = (p + z*z/(2*d)) / den; const h = z * Math.sqrt(p*(1-p)/d + z*z/(4*d*d)) / den; return [Math.max(0, c-h), Math.min(1, c+h)]; }
function levenshtein(a, b){ if (a === b) return 0; a = String(a); b = String(b); if (a.length > 4000 || b.length > 4000) return Math.abs(a.length - b.length) + 1; const m = a.length, n = b.length; let prev = new Array(n+1); for (let j=0;j<=n;j++) prev[j]=j; for (let i=1;i<=m;i++){ const cur=[i]; for (let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; } return prev[n]; }

function parseCSV(text){
  text = String(text).replace(/^﻿/, '');
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else q = false; } else field += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(field); field = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0].trim() === ''));
}
function toCSV(rows){ return rows.map(r => r.map(v => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n') + '\r\n'; }

function genericColumns(spec){
  const us = spec.country === 'US';
  const cols = (us ? US_BASE_COLS() : BD_BASE_COLS()).concat([
    {name:'days_since_index', type:'int', desc:'Days since the ' + spec.indexLabel + '. Starts the clock and sets the order of the list.'},
    {name:'next_step_status', type:'enum', values:['open','scheduled','completed'], desc:'Where the ' + spec.followupLabel + ' stands.'},
    {name:'days_to_next_step', type:'int', optional:true, desc:'Days from the ' + spec.indexLabel + ' to the ' + spec.followupLabel + ', when completed.'},
    {name:'prior_no_shows_12mo', type:'int', desc:'Count of missed appointments in the last 12 months. Second rule.'}
  ]);
  if (us) cols.push(
    {name:'preferred_contact', type:'enum', values:['phone','sms','mail','portal'], desc:'Which channel reaches this person.'},
    {name:'sdoh_flags', type:'list', values:['transport','language','food','housing','cost'], optional:true, desc:'Pipe-separated.'},
    {name:'pcp_id', type:'code', optional:true, desc:'Panel attribution.'},
    {name:'site_id', type:'code', desc:'Site code.'});
  else cols.push(
    {name:'phone_shared', type:'bool', desc:'true if the phone is shared, so calls go at the safe time.'},
    {name:'phone_safe_time', type:'enum', values:['morning','afternoon','evening','any'], desc:'When it is safe to call.'},
    {name:'preferred_contact', type:'enum', values:['phone','sms'], desc:'Channel.'},
    {name:'mfs_wallet_on_file', type:'bool', desc:'true if a mobile wallet is recorded for fare refunds.'},
    {name:'sdoh_flags', type:'list', values:['transport','work_release','cost','childcare','family','medicine_stockout','long_queue'], optional:true, desc:'Pipe-separated.'},
    {name:'site_id', type:'code', desc:'Provider site code.'});
  return cols;
}

  const contacted = fu.filter(p => contactedIds.has(p.id));

    excluded:fu.filter(p => p.status === 'excluded').length, excludedAfterWindow:fu.filter(p => p.status === 'excluded' && p.excludedAfterWindow).length, outOfAge:fu.filter(p => !p.inAgeWindow).length, completedNoDay:fu.filter(p => p.status === 'completed' && p.daysTo == null).length,

  }
  const totalSmall = isSmall(meas.filter(completedInWindow).length, meas.length);
  const shownExternal = rows.filter(r => !r.small && !r.complementary);
  const gap = shownExternal.length > 1 ? Math.round((Math.max(...shownExternal.map(r => r.rate)) - Math.min(...shownExternal.map(r => r.rate))) * 10) / 10 : null;
  const big = rows.filter(r => r.d >= min);
  const gapAll = big.length > 1 ? Math.round((Math.max(...big.map(r => r.rate)) - Math.min(...big.map(r => r.rate))) * 10) / 10 : null;
  return { rows, total:meas.length, gap, gapAll, min, totalSmall, isSmall };
}

function kmSVG(steps, win){
  const W = 640, H = 220, L = 44, R = 16, T = 12, B = 32; const maxT = 365;

  steps.forEach(s => { if (s.t > maxT) return; d += ' L' + x(s.t) + ' ' + y(lastC) + ' L' + x(s.t) + ' ' + y(s.c); lastC = s.c; });
  d += ' L' + x(maxT) + ' ' + y(lastC);
  const ticks = [0, 90, 180, 270, 365].map(t => '<line x1="' + x(t) + '" x2="' + x(t) + '" y1="' + T + '" y2="' + (H - B) + '" style="stroke:var(--hair);stroke-width:1"/><text x="' + x(t) + '" y="' + (H - B + 16) + '" text-anchor="middle">' + t + '</text>').join('');
  const yt = [0, 0.25, 0.5, 0.75, 1].map(c => '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(c) + '" y2="' + y(c) + '" style="stroke:var(--hair);stroke-width:1"/><text x="' + (L - 6) + '" y="' + (y(c) + 4) + '" text-anchor="end">' + Math.round(c * 100) + '%</text>').join('');
  return '<div style="overflow-x:auto"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:' + W + 'px;min-width:420px" role="img" aria-label="Cumulative share completed by day; ' + Math.round(lastC * 100) + '% by day 365">' + yt + ticks +
    '<line x1="' + x(win) + '" x2="' + x(win) + '" y1="' + T + '" y2="' + (H - B) + '" style="stroke:var(--coral-line);stroke-width:1.5;stroke-dasharray:4 4"/><text x="' + (x(win) + 4) + '" y="' + (T + 12) + '" text-anchor="start" style="fill:var(--coral-text)">' + win + '-day window</text>' +
    '<path d="' + d + '" style="fill:none;stroke:var(--chart);stroke-width:2"/><text x="' + ((L + W - R) / 2) + '" y="' + (H - 2) + '" text-anchor="middle">Days since the ' + esc(P().generic ? P().positiveLabel : 'positive result') + '</text></svg></div>';
}

 আগে নিশ্চিত হোন যে আপনি রোগীর সাথেই কথা বলছেন। ডাক্তার যে ভিজিটের কথা বলেছেন সেটি বুক করুন। {n}তম দিনে বা তার পরে করা পরীক্ষা এই হিসাবে গণনা হয়। ওষুধ পাওয়া গিয়েছিল কিনা জিজ্ঞেস করুন; ওষুধ না থাকলে সেটি বাধা হিসেবে লিখুন।", "Confirm you are speaking with the patient before mentioning diabetes.": "ডায়াবেটিসের কথা বলার আগে নিশ্চিত হোন যে আপনি রোগীর সাথেই কথা বলছেন।", "Confirm you are speaking with the patient before mentioning diabetes. Both tests are needed. Ask specifically about the urine sample.": "ডায়াবেটিসের কথা বলার আগে নিশ্চিত হোন যে আপনি রোগীর সাথেই কথা বলছেন। দুটো পরীক্ষাই দরকার। বিশেষ করে প্রস্রাবের নমুনার কথা জিজ্ঞেস করুন।", "Confirm you are speaking with the patient before mentioning the result. Tell them whether to come fasting, as written in the doctor’s order. If they report vomiting, abdominal pain, fast or deep breathing, confusion or unusual drowsiness, tell them to go to the nearest hospital emergency now or call {n} for an ambulance, then tell the doctor.": "ফলাফলের কথা বলার আগে নিশ্চিত হোন যে আপনি রোগীর সাথেই কথা বলছেন। ডাক্তারের নির্দেশে যেমন লেখা আছে, সেই অনুযায়ী খালি পেটে আসতে হবে কিনা জানান। যদি তিনি বমি, পেটে ব্যথা, দ্রুত বা গভীর শ্বাস, দিশেহারা ভাব বা অস্বাভাবিক ঝিমুনির কথা বলেন, তাহলে তাঁকে এখনই নিকটস্থ হাসপাতালের জরুরি বিভাগে যেতে বা অ্যাম্বুলেন্সের জন্য {n} নম্বরে ফোন করতে বলুন, তারপর ডাক্তারকে জানান।", "Confirm you are speaking with the patient. If the doctor already started medicine, book the visit the doctor asked for. If they report chest pain, shortness of breath, severe headache, weakness or numbness on one side, trouble speaking, vision changes or confusion, tell them to go to the nearest hospital emergency now or call {n} for an ambulance, then tell the doctor.": "নিশ্চিত হোন যে আপনি রোগীর সাথেই কথা বলছেন। ডাক্তার যদি ইতিমধ্যে ওষুধ শুরু করে থাকেন, ডাক্তার যে ভিজিটের কথা বলেছেন সেটি বুক করুন। যদি তিনি বুকে ব্যথা, শ্বাসকষ্ট, তীব্র মাথাব্যথা, শরীরের এক পাশে দুর্বলতা বা অবশ ভাব, কথা বলতে সমস্যা, চোখে দেখার পরিবর্তন বা দিশেহারা া পেরিয়ে গেছে, তাই এখন বাদ দিলে তা পর্যালোচনার ফাইলে চিহ্নিত হবে।", "Only a test on or after day {n} counts. Saying no is not a reason to remove someone: write it down as a contact instead. If the repeat haemoglobin test was done somewhere else, record it as done with its day count. This person is past the window, so removing them now is flagged in the review files.": "শুধু দিন {n} বা তার পরের পরীক্ষাই গোনা হয়। কেউ না বললে সেটি তাঁকে বাদ দেওয়ার কারণ নয়: বরং সেটি একটি যোগাযোগ হিসেবে লিখে রাখুন। আবার হিমোগ্লোবিন পরীক্ষা অন্য কোথাও হয়ে থাকলে, কত দিনে হয়েছে তা সহ সম্পন্ন হিসেবে লিখুন। এই ব্যক্তির সময়সীমা পেরিয়ে গেছে, তাই এখন বাদ দিলে তা পর্যালোচনার ফাইলে চিহ্নিত হবে।", "Only a test on or after day {n} counts. Saying no is not a reason to remove someone: write it down as a contact instead. If the {n}-day HbA{n}c test was done somewhere else, record it as done with its day count. This person is past the window, so removing them now is flagged in the review files.": "শুধু দিন {n} বা তার পরের পরীক্ষাই গোনা হয়। কেউ না বললে সেটি তাঁকে বাদ দেওয়ার কারণ নয়: বরং সেটি একটি যোগাযোগ হিসেবে লিখে রাখুন। {n} দিনের HbA{n}c পরীক্ষা অন্য কোথাও হয়ে থাকলে, কত দিনে হয়েছে তা সহ সম্পন্ন হিসেবে লিখুন। এই ব্যক্তির সময়সীমা পেরিয়ে গেছে, তাই এখন বাদ দিলে তা পর্যালোচনার ফাইলে চিহ্নিত হবে।", "Only a test on or after day {n} counts. Saying no is not a reason to remove someone: write it down as a contact instead. If the {n}-day blood pressure reading was done somewhere else, record it as done with its day count. This person is past the window, so removing them now is flagged in the review files.": "শুধু দিন {n} বা তার পরের পরীক্ষাই গোনা হয়। কেউ না বললে সেটি তাঁকে বাদ দেওয়ার কারণ নয়: বরং সেটি একটি যোগাযোগ হিসেবে লিখে রাখুন। {n} দিনের রক্তচাপ (প্রেশার) রিডিং অন্য কোথাও হয়ে থাকলে, কত দিনে হয়েছে তা সহ সম্পন্ন হিসেবে লিখুন। এই ব্যক্তির সময়সীমা পেরিয়ে গেছে, তাই এখন বাদ দিলে তা পর্যালোচনার ফাইলে চিহ্নিত হবে।", "Only results the doctor marked \"repeat in three months\" belong on this list. If the doctor asked for an earlier repeat, or the person reports passing little urine, swelling or vomiting, tell the doctor the same day. If they are breathless or confused, tell them to go to the nearest hospital emergency now or call {n} for an ambulance. Confirm you are speaking with the patient before mentioning the kidney test.": "শুধু যে ফলের পাশে ডাক্তার \"তিন মাস পর আবার\" লিখেছেন, সেগুলোই এই তালিকায় থাকবে। ডাক্তার যদি আরও আগে আবার পরীক্ষা করতে বলে থাকেন, অথবা ব্যক্তি জানান যে প্রস্রাব কম হচ্ছে, শরীর ফুলে যাচ্ছে বা বমি হচ্ছে, তাহলে সেদিনই ডাক্তারকে জানান। যদি শ্বাসকষ্ট থাকে বা দিশেহারা মনে হয়, তাহলে তাঁকে এখনই নিকটস্থ হাসপাতালের জরুরি বিভাগে যেতে বলুন অথবা অ্যাম্বুলেন্সের জন্য {n} নম্বরে কল করতে বলুন। কিডনি পরীক্ষার কথা বলার আগে নিশ্চিত হোন যে আপনি রোগীর সাথেই কথা বলছেন।", "Only the patient code and the step go on the calendar. No invitation is sent.": "ক্যালেন্ডারে শুধু রোগীর কোড আর ধাপটি যায়। কোনো আমন্ত্রণ পাঠানো হয় না।", "Open": "খোলা (এখনও বাকি)", "Open B-{n}, rank {n}": "B-{n} খুলুন, ক্রম {n}", "Open B{n}-{n}, rank {n}": "B{n}-{n} খুলুন, ক্রম {n}", "Open past {n} days": "খোলা, {n} দিন পেরিয়ে গেছে", "Open saved work": "সংরক্ষিত কাজ খুলুন", "Open the list": "তালিকা খুলুন", "Open the list. For each person, do what the “Next step” box says.": "তালিকা খুলুন। প্রত্যেক ব্যক্তির জন্য “পরের ধাপ” বক্সে যা লেখা আছে, তা করুন।", "Open your list (CSV)": "আপনার তালিকা খুলুন (CSV)", "Open · past {n} days": "খোলা · {n} দিন পেরিয়ে গেছে", "Optional": "ঐচ্ছিক", "Optional.": "ঐচ্ছিক।", "Optional. The web address of the clinic’s own booking page (starts with https).": "ঐচ্ছিক। ক্লিনিকের নিজের বুকিং পেজের ওয়েব ঠিকানা (https দিয়ে শুরু হয়)।", "Optional. Use a neutral name if the clinic name hints at a condition.": "ঐচ্ছিক। ক্লিনিকের নাম থেকে যদি কোনো রোগের ইঙ্গিত পাওয়া যায়, তাহলে একটি সাধারণ নাম ব্যবহার করুন।", "Or reject it. Why?": "অথবা বাতিল করুন। কেন?", "Other": "অন্যান্য", "Out of {n} on the list": "তালিকার {n} জনের মধ্যে", "Outside the measure age range": "ম le who had the {n}-day HbA{n}c test by each day after the start of diabetes treatment, counting open cases up to their current day (people in the measure age range, {n} people).": "ডায়াবেটিসের চিকিৎসা শুরুর পর প্রতিটি দিন পর্যন্ত কত অংশ মানুষের {n} দিনের HbA{n}c পরীক্ষা হয়েছে, খোলা কেসগুলো তাদের বর্তমান দিন পর্যন্ত গোনা হয়েছে (মাপকাঠির বয়সসীমার মধ্যে থাকা মানুষ, {n} জন)।", "Share of people who had the {n}-day blood pressure reading by each day after the start of blood pressure treatment, counting open cases up to their current day (people in the measure age range, {n} people).": "রক্তচাপের চিকিৎসা শুরুর পর প্রতিটি দিন পর্যন্ত কত অংশ মানুষের {n} দিনের রক্তচাপ (প্রেশার) রিডিং নেওয়া হয়েছে, খোলা কেসগুলো তাদের বর্তমান দিন পর্যন্ত গোনা হয়েছে (মাপকাঠির বয়সসীমার মধ্যে থাকা মানুষ, {n} জন)।", "Share of referred VIA-positive women reaching colposcopy within {n} days (Model A measure; illustrative file spec, to be agreed with the provider). Only people whose window has closed are counted.": "রেফার করা ভায়া (VIA) পজিটিভ নারীদের মধ্যে কত অংশ {n} দিনের মধ্যে কলপোস্কোপি করিয়েছেন (Model A মাপকাঠি; উদাহরণ হিসেবে ফাইলের বিবরণ, সেবাদাতার সাথে ঠিক করা হবে)। শুধু যাঁদের সময়সীমা শেষ হয়েছে, তাঁদেরই গোনা হয়।", "Sharing outside the clinic? Hide small groups (under {n} people)": "ক্লিনিকের বাইরে শেয়ার করছেন? ছোট দলগুলো লুকিয়ে রাখুন ({n} জনের কম)", "Show finished and removed": "শেষ হওয়া ও বাদ দেওয়াদের দেখান", "Show them": "তাঁদের দেখান", "Sign in to claude.ai to work as a team.": "দল হিসেবে কাজ করতে claude.ai-তে সাইন ইন করুন।", "Sign off as clinical lead": "ক্লিনিক্যাল প্রধান হিসেবে অনুমোদন সই করুন", "Sign off as translator": "অনুবাদক হিসেবে অনুমোদন সই করুন", "Sign-offs are saved under the name in Get ready. All wording here starts as a draft for the clinic to review. Other languages must be checked by a qualified translator before use.": "অনুমোদন সই “প্রস্তুতি” অংশে দেওয়া নামে সংরক্ষিত হয়। এখানের সব লেখা প্রথমে খসড়া হিসেবে থাকে, যা ক্লিনিক পর্যালোচনা করবে। অন্য ভাষার লেখা ব্যবহারের আগে একজন যোগ্য অনুবাদক দিয়ে যাচাই করাতে হবে।", "Signed-off wording": "অনুমোদিত (সই করা) ভাষা", "Signed-off wording only.": "শুধু অনুমোদিত (সই করা) ভাষা।", "Site’s own model.": "সাইটের নিজস্ব মডেল।", "Skip to the main content": "মূল অংশে চলে যান", "Smallest group to show outside the clinic ({n} or more)": "ক্লিনিকের বাইরে দেখানোর জন্য সবচেয়ে ছোট দল ({n} বা তার বেশি)", "Staff hours for outreach this week": "এই সপ্তাহে যোগাযোগের কাজে কর্মীর সময় (ঘণ্টা)", "Staff minutes": "কর্মীর সময় (মিনিট)", "Staff name used in messages": "বার্তায় ব্যবহৃত কর্মীর নাম", "Staff note": "কর্মীর জন্য নোট", "Staff note: Call at the safe time. Confirm you are speaking with the woman herself before mentioning the tablets or the test. Ask whether she is still taking the tablets and whether she ran out. If she is pregnant, she belongs in antenatal care: tell the doctor. Never share results with factory managers or supervisors.": "কর্মীর জন্য নোট: নিরাপদ সময়ে ফোন করুন। ট্যাবলেট বা পরীক্ষার কথা বলার আগে নিশ্চিত হোন যে আপনি ওই নারীর সাথেই কথা বলছেন। জিজ্ঞেস করুন তিনি এখনও ট্যাবলেট খাচ্ছেন কি না, আর ট্যাবলেট শেষ হয়ে গিয়েছিল কি না। তিনি গর্ভবতী হলে তাঁকে গর্ভকালীন সেবায় দেখা উচিত: ডাক্তারকে জানান। কারখানার ম্যানেজার বা সুপারভাইজারের সাথে কখনও ফলাফল শেয়ার করবেন না।", "Staff note: Call only at the safe time. Confirm you are speaking with the woman herself before saying anything about the screening.": "কর্মীর জন্য নোট: শুধু নিরাপদ সময়ে ফোন করুন। স্ক্রিনিং নিয়ে কিছু বলার আগে নিশ্চিত হোন যে আপনি ওই নারীর সাথেই কথা বলছেন।", "Staff note: Confirm you are speaking with the patient before mentioning blood pressure or medicine. Book the visit the doctor asked for. WHO and the national guideline advise a visit every month after starting or changing medicine until blood pressure is controlled: do not tell the person to wait until day {n}. A reading on or after day {n} counts for this measure. Ask whether the medicine was available; record a stock-out as a barrier.": "কর্মীর জন্য নোট: রক্তচাপ বা ওষুধের কথা বলার আগে নিশ্চিত হোন যে আপনি রোগীর সাথেই কথা বলছেন। ডাক্তার যে ভিজিটের কথা বলেছেন, সেটি বুক করুন। ওষুধ শুরু বা পরিবর্তনের পর রক্তচাপ নিয়ন্ত্রণে না আসা পর্যন্ত WHO এবং জাতীয় নির্দেশিকা প্রতি মাসে একবার ভিজিটের পরামর্শ দেয়: রোগীকে {n} নম্বর দিন পর্যন্ত অপেক্ষা করতে বলবেন না। {n} নম্বর দিনে বা তার পরে নেওয়া রিডিং এই মাপকাঠিতে গোনা হয়। ওষুধ পাওয়া যাচ্ছিল কি না জিজ্ঞেস করুন; ওষুধ স্টকে না থাকলে সেটি বাধা হিসেবে রেকর্ড করুন।", "Staff note: Confirm you are speaking with the patient before mentioning diabetes or medicine. Book the visit the doctor asked for. A test on or after day {n} counts for this measure. Ask whether the medicine was available; record a stock-out as a barrier.": "কর্মীর জন্য নোট: ডায়াবেটিস বা ওষুধের কথা বলার আগে নিশ্চিত হোন যে আপনি রোগীর সাথেই কথা বলছেন। ডাক্তার যে ভিজিটের কথা বলেছেন, সেটি বুক করুন। {n} নম্বর দিনে বা তার পরে করা পরীক্ষা এই মাপকাঠিতে গোনা হয়। ওষুধ পাওয়া যাচ্ছিল কি না জিজ্ঞেস করুন; ওষুধ স্টকে না থাকলে সেটি বাধা হিসেবে রেকর্ড করুন।", "Staff note: Confirm you are speaking with the patient before mentioning diabetes.": "কর্মীর জন্য নোট: ডায়াবেটিসের কথা বলার আগে নিশ্চিত হোন যে আপনি রোগীর সাথেই কথা বলছেন।", "Staff note: Confirm you are speaking with the patient before mentioning diabetes. Both tests are needed. Ask specifically about the urine sample.": "কর্মীর জন্য নোট: ডায়াবেটিসের কথা বলার আগে নিশ্চিত হোন যে আপনি রোগীর সাথেই কথা বলছেন। দুটো পরীক্ষাই দরকার। বিশেষ করে প্রস্রাবের নমুনার কথা জিজ্ঞেস করুন।", "Staff note: Confirm you are speaking with the patient before mentioning the result. Tell them whether to come fasting, as written in the doctor’s order. If they report vomiting, abdominal pain, fast or deep breathing, confusion or unusual drowsiness, tell them to go to the nearest hospital emergency now or call {n} for an ambulance, then tell the doctor.": "কর্মীর জন্য নোট: ফলাফলের কথা বলার আগে নিশ্চিত হোন যে আপনি রোগীর সাথেই কথা বলছেন। ডাক্তারের নির্দেশে যেমন লেখা আছে, সেই অনুযায়ী খালি পেটে আসতে হবে কি না তা জানিয়ে দিন। যদি তিনি বমি, পেটে ব্যথা, দ্রুত বা গভীর শ্বাস, দিশেহারা ভাব বা অস্বাভাবিক ঝিমুনির কথা বলেন, তাহলে তাঁকে এখনই নিকটস্থ হাসপাতালের জরুরি বিভাগে যেতে বলুন অথবা অ্যাম্বুলেন্সের জন্য {n} নম্বরে ফোন করতে বলুন, তারপর ডাক্তারকে জানান।", "Staff note: Confirm you are speaking with the patient. If the doctor already started medicine, book the visit the doctor asked for. If they report chest pain, shortness of breath, severe headache, weakness or numbness on one side, trouble speaking, vision changes or confusion, tell them to go to the nearest hospital emergency now or call {n} for an ambulance, then tell the doctor.": "কর্মীর জন্য নোট: নিশ্চিত হোন যে আপনি রোগীর সাথেই কথা বলছেন। ডাক্তার যদি আগেই ওষুধ শুরু করে থাকেন, তাহলে ডাক্তার যে ভিজিটের কথা বলেছেন, সেটি বুক করুন। যদি তিনি বুকে ব্যথা, শ্বাসকষ্ট, তীব্র মাথাব্যথা, শরীরের এক পাশে দুর্বলতা বা অবশ ভাব, কথা বলতে সমস্যা, চোখে দেখার পরিবর্তন বা দিশেহারা ভাবের কথা বলেন, তাহলে তাঁকে এখনই নিকটস্থ হাসপাতালের জরুরি বিভাগে যেতে বলুন অথবা অ্যাম্বুলেন্সের জন্য {n} নম্বরে ফোন করতে বলুন, তারপর ডাক্তারকে জানান।", "Staff note: Only results the doctor marked \"repeat in three months\" belong on this list. If the doctor asked for an earlier repeat, or the person reports passing little urine, swelling or vomiting, tell the doctor the same day. If they are breathless or confused, tell them to go to the nearest hospital emergency now or call {n} for an ambulance. Confirm you are speaking with the patient before mentioning the kidney test.": "কর্মীর জন্য নোট: শুধু যেসব ফলাফলে ডাক্তার “তিন মাস পর আবার পরীক্ষা” চিহ্নিত করেছেন, সেগুলোই এই তালিকায় থাকবে। ডাক্তার যদি আরও আগে আবার পরীক্ষা করতে বলে থাকেন, অথবা ব্যক্তি যদি প্রস্রাব কম হওয়া, শরীর ফোলা বা বমির কথা বলেন, তাহলে সেদিনই ডাক্তারকে জানান। যদি তাঁর শ্বাসকষ্ট হয় বা তিনি দিশেহারা থাকেন, তাহলে তাঁকে এখনই নিকটস্থ হাসপাতালের জরুরি বিভাগে যেতে বলুন অথবা অ্যাম্বুলেন্সের জন্য {n} নম্বরে ফোন করতে বলুন। কিডনি পরীক্ষার কথা বলার আগে নিশ্চিত হোন যে আপনি রোগীর সাথেই কথা বলছেন।", "Staff note: Phones may be shared. Never name the condition, the test or the result in a text.": "কর্মীর জন্য নোট: একই ফোন অনেকে ব্যবহার করতে পারেন। এসএমএসে কখনও রোগের নাম, পরীক্ষার নাম বা ফলাফল লিখবেন না।", "Staff note: Phones may be shared. Never name the screening or the result in a text.": "কর্মীর জন্য নোট: একই ফোন অনেকে ব্যবহার করতে পারেন। এসএমএসে কখনও স্ক্রিনিংয়ের নাম বা ফলাফল লিখবেন না।", "Start a team list from this list": "এই তালিকা থেকে একটি দলের তালিকা শুরু করুন", "Start over": "আবার শুরু করুন", "Start with the person at the top of the list. The tool suggests the first message for each one.": "তালিকার সবার উপরের মানুষ দিয়ে শুরু করুন। টুল প্রত্যেকের জন্য প্রথম বার্তা সাজিয়ে দেয়।", "Starts the follow-up clock.": "ফলো-আপের সময় গোনা শুরু হয়।", "Status": "অবস্থা", "Step A": "ধাপ A", "Step B": "ধাপ B", "Step C": "ধাপ C", "Step {n}:": "ধাপ {n}:", "Steps": "ধাপগুলো", "Still open": "এখনও খোলা", "Suggest from the note": "নোট থেকে পরামর্শ দেখুন", "Summary (CSV)": "সারসংক্ষেপ (CSV)", "Table, scroll sideways on small screens": "টেবিল, ছোট স্ক্রিনে পাশে স্ক্রল করুন", "Team working": "দলগত কাজ", "Template": "টেমপ্লেট", "Text message": "এসএমএস", "Text sent": "এসএমএস পাঠানো হয়েছে", "Texts through Zapier": "Zapier দিয়ে এসএমএস", "The CSV has one row per message: batch, code, channel, language, the approved text and who approved it. The FHIR R{n} file holds the same messages as Communication resources in preparation status.": "CSV ফাইলে প্রতিটি বার্তার জন্য একটি সারি থাকে: ব্যাচ, কোড, মাধ্যম, ভাষা, অনুমোদিত লেখা এবং কে অনুমোদন করেছেন। FHIR R{n} ফাইলে একই বার্তাগুলো preparation অবস্থার Communication রিসোর্স হিসেবে থাকে।", "The biggest problem is childcare: {n} of {n} open people": "সবচেয়ে বড় সমস্যা শিশুর দেখাশোনা: {n} জন (খোলা থাকা মোট {n} জনের মধ্যে)", "The biggest problem is medicine out of stock: {n} of {n} open people": "সবচেয়ে বড় সমস্যা ওষুধ স্টকে না থাকা: {n} জন (খোলা থাকা মোট {n} জনের মধ্যে)", "The biggest problem is transport: {n} of {n} open people": "সবচেয়ে বড় সমস্যা যাতায়াত ch the signed-off wording (BD-ANAEMIA-CALL v{n})": "লেখাটি অনুমোদিত (সই করা) ভাষার সাথে মিলে যায় (BD-ANAEMIA-CALL v{n})", "The words match the signed-off wording (BD-CKD-CALL v{n})": "লেখাটি অনুমোদিত (সই করা) ভাষার সাথে মিলে যায় (BD-CKD-CALL v{n})", "The words match the signed-off wording (BD-DM-A{n}C-CALL v{n})": "লেখাটি অনুমোদিত (সই করা) ভাষার সাথে মিলে যায় (BD-DM-A{n}C-CALL v{n})", "The words match the signed-off wording (BD-DM-CALL v{n})": "লেখাটি অনুমোদিত (সই করা) ভাষার সাথে মিলে যায় (BD-DM-CALL v{n})", "The words match the signed-off wording (BD-DM-EYE-CALL v{n})": "লেখাটি অনুমোদিত (সই করা) ভাষার সাথে মিলে যায় (BD-DM-EYE-CALL v{n})", "The words match the signed-off wording (BD-DM-KIDNEY-CALL v{n})": "কথাগুলো অনুমোদিত (সই করা) ভাষার সাথে মিলেছে (BD-DM-KIDNEY-CALL v{n})", "The words match the signed-off wording (BD-HTN-CALL v{n})": "কথাগুলো অনুমোদিত (সই করা) ভাষার সাথে মিলেছে (BD-HTN-CALL v{n})", "The words match the signed-off wording (BD-HTN-CONTROL-CALL v{n})": "কথাগুলো অনুমোদিত (সই করা) ভাষার সাথে মিলেছে (BD-HTN-CONTROL-CALL v{n})", "The words match the signed-off wording (VIA-CALL v{n})": "কথাগুলো অনুমোদিত (সই করা) ভাষার সাথে মিলেছে (VIA-CALL v{n})", "Their {n}-day window ends in {n} days or less. Contact them first: these are the completions you can still count as on time.": "তাঁদের {n} দিনের সময়সীমা {n} দিন বা তার কম সময়ের মধ্যে শেষ হবে। আগে তাঁদের সাথে যোগাযোগ করুন: এঁরা শেষ করলে এখনও সময়মতো হিসেবে গোনা যাবে।", "These are simple counts and fixed rules, shown in full. They never change who is first on the list. Small numbers can change quickly, so read the counts, not only the percentages.": "এগুলো সাধারণ গণনা আর নির্দিষ্ট নিয়ম, পুরোটা দেখানো হয়েছে। তালিকায় কে প্রথমে থাকবেন, এগুলো তা কখনো বদলায় না। সংখ্যা ছোট হলে দ্রুত বদলাতে পারে, তাই শুধু শতাংশ নয়, সংখ্যাগুলোও পড়ুন।", "They no longer count as on time, but they still need the colposcopy. Keep going with them after the people near the deadline.": "তাঁদের আর সময়মতো হিসেবে ধরা হবে না, কিন্তু function findDeep(o, test, out){ out = out || []; if (!o || typeof o !== 'object') return out; if (test(o)) out.push(o); (Array.isArray(o) ? o : Object.values(o)).forEach(v => { if (v && typeof v === 'object') findDeep(v, test, out); }); return out; }
async function setupZapSms(){

    if (real){ const dsc = await mcpCall('Zapier', 'discover_zapier_actions', { app:'Twilio' }); const a = findDeep(dsc, o => typeof o.selected_api === 'string' && /twilio/i.test(String(o.app || '')))[0]; if (!a){ toast('Twilio was not found in Zapier.'); return; } api = a.selected_api; appName = a.app; }
    await mcpCall('Zapier', 'enable_zapier_action', { selected_api:api, app_display_name:appName });
    const ins = await mcpCall('Zapier', 'inspect_zapier_actions', { selected_api:api });
    const acts = findDeep(ins, o => typeof o.tool_name === 'string' && typeof o.action === 'string');
    const act = acts.find(o => /write|create/i.test(String(o.action_type || '')) && /sms|send|message/i.test(o.action + ' ' + o.tool_name)) || acts.find(o => /sms|send/i.test(o.action + ' ' + o.tool_name));
    if (!act){ toast('Zapier did not list a send action. Set up texting in Zapier, then try again.'); return; }
    const det = await mcpCall('Zapier', 'inspect_zapier_actions', { tool_name:act.tool_name });
    const keys = new Set(); findDeep(det, o => typeof o.key === 'string' || typeof o.name === 'string').forEach(o => keys.add(String(o.key || o.name)));
    findDeep(det, o => o && typeof o === 'object' && !Array.isArray(o) && o.params && typeof o.params === 'object').forEach(o => Object.keys(o.params).forEach(k => keys.add(k)));
    findDeep(det, o => o && o.properties && typeof o.properties === 'object').forEach(o => Object.keys(o.properties).forEach(k => keys.add(k)));
    const ks = Array.from(keys);
    const toKey = ks.find(k => /^(to|to_?number|to_?phone|phone|phone_?number|recipient|number)$/i.test(k)) || ks.find(k => /to.?number|phone|recipient/i.test(k));
    const msgKey = ks.find(k => /^(message|body|text|sms|content)$/i.test(k)) || ks.find(k => /message|body|text/i.test(k));
    if (!toKey || !msgKey){ toast('Could not read the texting fields from Zapier. Check the action in Zapier.'); return; }
